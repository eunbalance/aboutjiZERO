<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지영이 사진</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F2F2F5}
a{color:#17171C;text-decoration:none}a:hover{color:#000}
.roll{scrollbar-width:none}.roll::-webkit-scrollbar{display:none}
.shot{display:block;width:100%;border-radius:20px;object-fit:cover;box-shadow:0 16px 32px rgba(23,23,28,.08)}
.cap{font-size:12px;color:#5E5E68;letter-spacing:.12em}
</style>
<style>
*{box-sizing:border-box}
body{margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
.app{width:100%;max-width:414px;min-height:100vh;min-height:100dvh;margin:0 auto;position:relative}
.app.splash{position:fixed;left:50%;top:0;width:414px;height:896px;min-height:0;max-width:none;margin:0;transform-origin:top center;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="app" style="box-sizing: border-box; background: #F2F2F5; font-family: 'Noto Serif KR', serif; color: #17171C; display: flex; flex-direction: column">

  <div style="padding: 54px 20px 12px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span class="cap">ARCHIVE · 4 PHOTOS</span>
      <h1 style="margin: 0; font-size: 26px; font-weight: 500; letter-spacing: -0.02em">지영이 사진</h1>
    </div>
    <a href="home.html" aria-label="홈으로 돌아가기" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
  </div>

  <div class="roll" style="flex: 1; overflow-y: auto; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 28px">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
      <img class="shot" src="photo-birth.jpg" alt="바닷가 난간 앞에 선 김지영" style="height: 280px; object-position: 62% 40%">
      <figcaption class="cap">No. 01</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
      <img class="shot" src="photo-food.jpg" alt="지하철역 벤치에 앉은 김지영" style="height: 440px; object-position: 50% 30%">
      <figcaption class="cap">No. 02</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
      <img class="shot" src="photo-exercise.jpg" alt="러닝을 마치고 찍은 김지영 셀카" style="height: 440px; object-position: 60% 35%">
      <figcaption class="cap">No. 03</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
      <img class="shot" src="photo-philosophy.jpg" alt="도서관에서 공부하는 김지영" style="height: 240px; object-position: 50% 40%">
      <figcaption class="cap">No. 04</figcaption>
    </figure>
    <a href="home.html" style="flex: none; height: 56px; border-radius: 999px; background: #17171C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500">홈으로 돌아가기</a>
  </div>
</div>
</body>
</html>
