<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>김지영의 최애음식</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#17171C;text-decoration:none}a:hover{color:#000}
button{font-family:inherit;cursor:pointer}
.tab{writing-mode:vertical-rl;font-size:13px;color:#6E6E78;font-weight:500;padding:10px 12px;display:flex;align-items:center;gap:8px;letter-spacing:0.04em}
.tab-on{color:#17171C;font-weight:700}
.dot{width:5px;height:5px;border-radius:50%;background:#17171C}
.carousel{scrollbar-width:none}.carousel::-webkit-scrollbar{display:none}
.bigdisc{border-radius:50%;background:repeating-radial-gradient(circle at center,#1E1E24 0 2px,#2C2C33 2px 4px);display:flex;align-items:center;justify-content:center}
.inforow{display:flex;justify-content:space-between;align-items:center;height:44px;border-top:1px solid #EDEDF1;font-size:14px}
</style>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
.app{width:100%;max-width:414px;height:100vh;height:100dvh;max-height:896px;margin:0 auto;position:relative}
@media (min-width:500px){.app{border-radius:40px;box-shadow:0 30px 80px rgba(0,0,0,.18)}}
</style>
</head>
<body>
<div class="app" style="box-sizing: border-box; background: #FFFFFF; font-family: 'Noto Serif KR', serif; color: #17171C; display: flex; overflow: hidden">

  <nav aria-label="항목" style="width: 64px; flex: none; border-right: 1px solid #EDEDF1; box-sizing: border-box; padding: 54px 0 28px; display: flex; flex-direction: column; align-items: center">
    <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; width: 16px; height: 16px">
      <span style="border-radius: 50%; background: #9A9AA4"></span><span style="border-radius: 50%; background: #17171C"></span>
      <span style="border-radius: 50%; background: #9A9AA4"></span><span style="border-radius: 50%; background: #9A9AA4"></span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center">
      <a href="birth.html" class="tab">생년월일</a>
      <a href="food.html" class="tab tab-on" aria-current="page"><span class="dot"></span>최애음식</a>
      <a href="exercise.html" class="tab">운동 방법</a>
      <a href="philosophy.html" class="tab">철학</a>
    </div>
    <button aria-label="검색" style="width: 44px; height: 44px; border: none; background: transparent; color: #17171C; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.2-4.2"></path></svg>
    </button>
  </nav>

  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 54px 20px 0; display: flex; flex-direction: column">
    <a href="explore.html" style="align-self: flex-start; height: 32px; display: flex; align-items: center; gap: 4px; font-size: 13px; color: #5E5E68">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
      뒤로
    </a>

    <div style="margin-top: 12px; height: 200px; border-radius: 20px; background: #F2F2F5; position: relative; overflow: hidden">
      <div id="track" style="display: flex; width: 200%; height: 200px; transform: translateX(0%); transition: transform 0.45s ease; touch-action: pan-y; cursor: grab; user-select: none">
      <div style="flex: none; width: 50%; height: 200px; display: flex; align-items: center; justify-content: center">
      <div class="bigdisc" style="width: 168px; height: 168px; box-shadow: 0 16px 32px rgba(23,23,28,0.18)">
        <div style="width: 60px; height: 60px; border-radius: 50%; background: #F3E6DC; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500">02</div>
      </div>
      </div>
      <div style="flex: none; width: 50%; height: 200px">
        <img draggable="false" src="assets/food.jpg" alt="지하철역 벤치에 앉은 김지영" style="display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%">
      </div>
      </div>
      
        <button id="nextBtn" aria-label="사진 보기" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border: none; border-radius: 50%; background: rgba(255,255,255,0.55); color: #17171C; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(23,23,28,0.08)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
        </button>
      
      
        <button id="prevBtn" hidden aria-label="LP 보기" style="position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border: none; border-radius: 50%; background: rgba(255,255,255,0.55); color: #17171C; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(23,23,28,0.08)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
        </button>
      
      <div aria-hidden="true" style="position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; background: rgba(23,23,28,0.55); padding: 5px 7px; border-radius: 999px; pointer-events: none">
        <span id="dot1" style="width: 5px; height: 5px; border-radius: 50%; background: #FFFFFF"></span>
        <span id="dot2" style="width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.45)"></span>
      </div>
    </div>

    <h1 style="margin: 20px 0 0; font-size: 22px; font-weight: 500; letter-spacing: -0.02em">김지영의 최애음식</h1>
    <div style="margin-top: 4px; font-size: 13px; color: #5E5E68">No. 02 · 취향</div>

    <div style="margin-top: 18px; font-size: 30px; font-weight: 300; letter-spacing: -0.01em">닭갈비</div>

    <div style="margin-top: 14px; display: flex; flex-direction: column">
      <div class="inforow" style="height: auto; min-height: 44px; padding: 10px 0; gap: 16px; align-items: flex-start"><span style="flex: none; color: #5E5E68">충격 사실</span><span style="font-weight: 500; text-align: right; line-height: 1.5">죽을 때까지 한 가지 음식만 먹는다면 닭갈비로 전해져,,,</span></div>
      <div class="inforow"><span style="color: #5E5E68">단골 가게</span><span style="font-weight: 500">모르겠음</span></div>
      <div class="inforow" style="border-bottom: 1px solid #EDEDF1"><span style="color: #5E5E68">꼭 곁들이는 것</span><span style="font-weight: 500">나도 알려줘</span></div>
    </div>

    <h2 style="margin: 22px 0 0; font-size: 16px; font-weight: 600">왜 좋아할까</h2>
    <p style="margin: 8px 0 0; font-size: 14px; line-height: 1.7; color: #5E5E68">아무래도 닭갈비는 거부할 수 없는 매력이 있긴 해</p>

    <div style="margin-top: auto; height: 64px; border-top: 1px solid #EDEDF1; display: flex; align-items: center; gap: 10px; font-size: 12px; color: #5E5E68">
      <span>02</span>
      <div style="flex: 1; height: 2px; background: #EDEDF1; position: relative"><div style="position: absolute; left: 0; top: 0; height: 2px; width: 50%; background: #17171C"></div></div>
      <span>04</span>
      <button aria-label="글자 크기" style="height: 44px; padding: 0 6px; border: none; background: transparent; font-size: 14px; font-weight: 600; color: #17171C">가A</button>
    </div>
  </main>
</div>
<script>
var track = document.getElementById('track');
var nextBtn = document.getElementById('nextBtn');
var prevBtn = document.getElementById('prevBtn');
var dot1 = document.getElementById('dot1');
var dot2 = document.getElementById('dot2');
var ON = '#FFFFFF', OFF = 'rgba(255,255,255,0.45)';
function go(i) {
  track.style.transform = 'translateX(' + (i === 1 ? '-50%' : '0%') + ')';
  nextBtn.hidden = i === 1;
  prevBtn.hidden = i === 0;
  dot1.style.background = i === 0 ? ON : OFF;
  dot2.style.background = i === 1 ? ON : OFF;
}
nextBtn.addEventListener('click', function () { go(1); });
prevBtn.addEventListener('click', function () { go(0); });
var downX = null;
track.addEventListener('pointerdown', function (e) { downX = e.clientX; });
window.addEventListener('pointerup', function (e) {
  if (downX === null) return;
  var dx = e.clientX - downX; downX = null;
  if (dx < -30) go(1); else if (dx > 30) go(0);
});
</script>
</body>
</html>
