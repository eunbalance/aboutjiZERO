<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>검색</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F2F2F5}
a{color:#17171C;text-decoration:none}a:hover{color:#000}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
input::placeholder{color:#8A8A94}
input:focus{outline:none}
.chip{height:40px;padding:0 16px;border-radius:999px;background:#FFFFFF;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
</style>
<style>
*{box-sizing:border-box}
body{margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
.app{width:100%;max-width:414px;min-height:100vh;min-height:100dvh;margin:0 auto;position:relative}
.app.splash{position:fixed;left:50%;top:0;width:414px;height:896px;min-height:0;max-width:none;margin:0;transform-origin:top center;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="app" style="box-sizing: border-box; background: #F2F2F5; font-family: 'Noto Serif KR', serif; color: #17171C; padding: 54px 20px 28px; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; gap: 8px">
    <a href="home.html" aria-label="홈으로" style="flex: none; width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <label style="flex: 1; height: 48px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 16px; box-sizing: border-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E5E68" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.2-4.2"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">검색어</span>
      <input type="search" id="q" placeholder="지영이에 대해 검색해 보세요" style="flex: 1; min-width: 0; border: none; background: transparent; font-size: 14px; color: #17171C">
    </label>
  </div>

  <div style="margin-top: 32px; display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-size: 16px; font-weight: 600">최근 검색어</h1>
    
      <button id="clearAll" style="height: 44px; padding: 0; border: none; background: transparent; font-size: 13px; color: #5E5E68">전체 삭제</button>
    
  </div>

  <div style="margin-top: 6px; display: flex; flex-direction: column">
    <div id="recent"></div>
    
      <div id="empty" hidden style="padding: 20px 0; font-size: 14px; color: #5E5E68">최근 검색어가 없어요</div>
    
  </div>

  <h2 style="margin: 36px 0 12px; font-size: 16px; font-weight: 600">항목 바로가기</h2>
  <div style="display: flex; flex-wrap: wrap; gap: 8px">
    <a href="birth.html" class="chip"><span style="width: 10px; height: 10px; border-radius: 50%; background: #E8E4F3"></span>생년월일</a>
    <a href="food.html" class="chip"><span style="width: 10px; height: 10px; border-radius: 50%; background: #F3E6DC"></span>최애음식</a>
    <a href="exercise.html" class="chip"><span style="width: 10px; height: 10px; border-radius: 50%; background: #DDEBE3"></span>운동 방법</a>
    <a href="philosophy.html" class="chip"><span style="width: 10px; height: 10px; border-radius: 50%; background: #E2E7F0"></span>철학</a>
  </div>
</div>
<script>
var items = ['김지영은 무엇을 하나', '지영이의 하루', '지영이 연애소식'];
var box = document.getElementById('recent');
var q = document.getElementById('q');
var CLOCK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8A94" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l2.5 2"></path></svg>';
var X = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>';
function render() {
  box.innerHTML = '';
  items.forEach(function (t, i) {
    var row = document.createElement('div');
    row.style.cssText = 'display: flex; align-items: center; gap: 12px; height: 52px; border-bottom: 1px solid #E4E4EA';
    row.innerHTML = CLOCK +
      '<button class="use" style="flex: 1; height: 44px; padding: 0; border: none; background: transparent; text-align: left; font-size: 15px; color: #17171C"></button>' +
      '<button class="del" style="width: 44px; height: 44px; margin-right: -12px; border: none; background: transparent; color: #8A8A94; display: flex; align-items: center; justify-content: center">' + X + '</button>';
    row.querySelector('.use').textContent = t;
    row.querySelector('.del').setAttribute('aria-label', t + ' 삭제');
    row.querySelector('.use').addEventListener('click', function () { q.value = t; q.focus(); });
    row.querySelector('.del').addEventListener('click', function () { items.splice(i, 1); render(); });
    box.appendChild(row);
  });
  document.getElementById('clearAll').hidden = items.length === 0;
  document.getElementById('empty').hidden = items.length !== 0;
}
document.getElementById('clearAll').addEventListener('click', function () { items = []; render(); });
render();
</script>
</body>
</html>
