<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>김지영백과사전 홈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F2F2F5}
a{color:#17171C;text-decoration:none}a:hover{color:#000}
button{font-family:inherit;cursor:pointer}
.pearl{border-radius:50%;background:repeating-radial-gradient(circle at center,#ECECF1 0 2px,#E0E0E7 2px 3px);box-shadow:inset 0 0 0 1px rgba(23,23,28,.06)}
.hole{border-radius:50%;background:#F7F7FA;box-shadow:inset 0 0 0 1px rgba(23,23,28,.08)}
</style>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
.app{width:100%;max-width:414px;height:100vh;height:100dvh;max-height:896px;margin:0 auto;position:relative}
@media (min-width:500px){.app{border-radius:40px;box-shadow:0 30px 80px rgba(0,0,0,.18)}}
</style>
</head>
<body>
<div class="app" style="box-sizing: border-box; background: #F2F2F5; font-family: 'Noto Serif KR', serif; color: #17171C; padding: 54px 20px 28px; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
    <a href="gallery.html" aria-label="지영이 사진 보기" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #17171C">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 9h14M5 15h9"></path></svg>
    </a>
    <div style="display: flex; gap: 2px; background: #FFFFFF; border-radius: 999px; padding: 4px">
      <button style="height: 36px; padding: 0 14px; border: none; border-radius: 999px; background: #17171C; color: #FFFFFF; font-size: 13px; font-weight: 500">전체</button>
      <button data-toast="뿡" style="height: 36px; padding: 0 14px; border: none; border-radius: 999px; background: transparent; color: #5E5E68; font-size: 13px; font-weight: 500">기본</button>
      <button data-toast="바로 은수?" style="height: 36px; padding: 0 14px; border: none; border-radius: 999px; background: transparent; color: #5E5E68; font-size: 13px; font-weight: 500">취향</button>
      <button data-toast="비~밀" style="height: 36px; padding: 0 14px; border: none; border-radius: 999px; background: transparent; color: #5E5E68; font-size: 13px; font-weight: 500">생각</button>
    </div>
    <a href="search.html" aria-label="검색" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #17171C">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.2-4.2"></path></svg>
    </a>
  </div>

  <div style="margin-top: 28px; display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 12px; letter-spacing: 0.14em; color: #5E5E68; font-weight: 500">ENCYCLOPEDIA OF KIM JIYOUNG</div>
    <h1 style="margin: 0; font-size: 28px; font-weight: 500; letter-spacing: -0.02em">김지영백과사전</h1>
  </div>

  <div style="position: relative; height: 448px; margin-top: 22px; display: flex; align-items: center; justify-content: center">
    <div style="position: absolute; width: 286px; height: 396px; border-radius: 28px; background: #E6E6EC; transform: rotate(-7deg) translateX(-14px)"></div>
    <div style="position: absolute; width: 286px; height: 396px; border-radius: 28px; background: #ECECF1; transform: rotate(5deg) translateX(14px)"></div>
    <div style="position: relative; width: 300px; height: 420px; border-radius: 28px; background: #FFFFFF; box-shadow: 0 24px 48px rgba(23,23,28,0.08); box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; overflow: hidden">
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #5E5E68; font-weight: 500; letter-spacing: 0.06em">
        <span>VOL. 01</span>
        <span>4 ENTRIES</span>
      </div>
      <div style="position: relative; height: 180px; margin-top: 18px">
        <div class="pearl" style="position: absolute; left: 0; top: 10px; width: 160px; height: 160px"></div>
        <div class="pearl" style="position: absolute; left: 48px; top: 10px; width: 160px; height: 160px"></div>
        <div class="pearl" style="position: absolute; left: 96px; top: 0; width: 180px; height: 180px; display: flex; align-items: center; justify-content: center; background: repeating-radial-gradient(circle at center,#D9D9E1 0 1px,#F1F1F5 1px 3px)">
          <div class="hole" style="width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500">김</div>
        </div>
      </div>
      <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 34px; line-height: 1.12; font-weight: 500; letter-spacing: -0.03em; white-space: nowrap">김지영<span style="color: #9A9AA4">을 읽는</span><br>네 갈래</div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <div style="font-size: 13px; color: #5E5E68">생년월일 · 최애음식 · 운동 · 철학</div>
        <button aria-label="좋아요" style="flex: none; width: 48px; height: 48px; border-radius: 50%; border: 1px solid #E6E6EC; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #17171C">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
        </button>
        </div>
      </div>
    </div>
  </div>

  <a href="explore.html" style="margin-top: 22px; height: 56px; border-radius: 999px; background: #17171C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600">
    Open
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
  </a>

  <nav style="margin-top: auto; height: 64px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: space-around; padding: 0 12px">
    <a href="home.html" aria-label="홈" style="width: 48px; height: 48px; border-radius: 50%; background: #17171C; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"></path></svg>
    </a>
    <a href="explore.html" aria-label="탐색" style="width: 48px; height: 48px; border-radius: 50%; color: #5E5E68; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2.5"></circle></svg>
    </a>
    <a href="explore.html" aria-label="저장" style="width: 48px; height: 48px; border-radius: 50%; color: #5E5E68; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7 4h10v16l-5-3.5L7 20z"></path></svg>
    </a>
  </nav>

  
    <div id="toast" hidden style="position: absolute; inset: 0; background: rgba(23,23,28,0.32); display: flex; align-items: center; justify-content: center; z-index: 10">
      <div role="dialog" aria-modal="true" aria-label="취향" style="width: 260px; box-sizing: border-box; padding: 32px 20px 20px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 24px 48px rgba(23,23,28,0.16); display: flex; flex-direction: column; align-items: center; gap: 28px">
        <div style="font-size: 22px; font-weight: 500; letter-spacing: -0.01em" id="toastText"></div>
        <button id="toastClose" style="width: 100%; height: 48px; border: none; border-radius: 999px; background: #17171C; color: #FFFFFF; font-size: 14px; font-weight: 500">닫기</button>
      </div>
    </div>
  
</div>
<script>
var toast = document.getElementById('toast');
document.querySelectorAll('[data-toast]').forEach(function (btn) {
  btn.addEventListener('click', function () {
    document.getElementById('toastText').textContent = btn.getAttribute('data-toast');
    toast.hidden = false;
  });
});
document.getElementById('toastClose').addEventListener('click', function () { toast.hidden = true; });
toast.addEventListener('click', function (e) { if (e.target === toast) toast.hidden = true; });
</script>
</body>
</html>
