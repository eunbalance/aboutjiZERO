<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>항목 선택</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAFAFC}
a{color:#17171C;text-decoration:none}a:hover{color:#000}
button{font-family:inherit;cursor:pointer}
.disc{flex:none;width:92px;height:92px;border-radius:50%;background:repeating-radial-gradient(circle at center,#1E1E24 0 2px,#2C2C33 2px 4px);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(23,23,28,.14)}
.label{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#17171C}
.list{scrollbar-width:none;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 18%,#000 82%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 18%,#000 82%,transparent 100%)}
.list::-webkit-scrollbar{display:none}
.item{will-change:transform;transition:transform .55s cubic-bezier(.22,1,.36,1),opacity .55s cubic-bezier(.22,1,.36,1),background-color .45s ease,box-shadow .45s ease}
.tilt{will-change:transform;transition:transform .55s cubic-bezier(.22,1,.36,1)}
.go{transition:opacity .35s ease,transform .45s cubic-bezier(.22,1,.36,1)}
.pick{border:none;background:transparent;padding:0;text-align:left;color:#17171C}
</style>
<style>
*{box-sizing:border-box}
body{margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
.app{width:100%;max-width:414px;min-height:100vh;min-height:100dvh;margin:0 auto;position:relative}
.app.splash{position:fixed;left:50%;top:0;width:414px;height:896px;min-height:0;max-width:none;margin:0;transform-origin:top center;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="app" style="box-sizing: border-box; background: #FAFAFC; font-family: 'Noto Serif KR', serif; color: #17171C; padding: 54px 20px 28px; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="home.html" aria-label="홈으로" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <button aria-label="더보기" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; color: #17171C">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>
    </button>
  </div>
  <div style="margin-top: 6px; display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 500; letter-spacing: -0.02em">탐색</h1>
    <div style="font-size: 14px; color: #5E5E68">제가 아는 지영이를 소개합니다</div>
  </div>

  <div class="list" id="list" style="margin-top: 18px; height: 560px; overflow-y: auto; overflow-x: hidden; scroll-snap-type: y mandatory; scroll-behavior: smooth; box-sizing: border-box; padding: 226px 0"></div>

  <nav style="margin-top: auto; height: 64px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(23,23,28,0.05); display: flex; align-items: center; justify-content: space-around; padding: 0 12px">
    <a href="home.html" aria-label="홈" style="width: 48px; height: 48px; border-radius: 50%; color: #5E5E68; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"></path></svg>
    </a>
    <a href="explore.html" aria-label="탐색" style="width: 48px; height: 48px; border-radius: 50%; background: #17171C; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2.5"></circle></svg>
    </a>
    <a href="home.html" aria-label="저장" style="width: 48px; height: 48px; border-radius: 50%; color: #5E5E68; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7 4h10v16l-5-3.5L7 20z"></path></svg>
    </a>
  </nav>
</div>
<script>
var ENTRIES = [
  { no: '01', title: '생년월일', sub: '김지영의 생년월일', href: 'birth.html', tone: '#E8E4F3' },
  { no: '02', title: '최애음식', sub: '김지영의 최애음식', href: 'food.html', tone: '#F3E6DC' },
  { no: '03', title: '운동 방법', sub: '김지영의 운동 방법', href: 'exercise.html', tone: '#DDEBE3' },
  { no: '04', title: '철학', sub: '김지영의 철학', href: 'philosophy.html', tone: '#E2E7F0' }
];
var STEP = 108;
var list = document.getElementById('list');
var sel = -1;
var rows = ENTRIES.map(function (e, i) {
  var row = document.createElement('div');
  row.style.cssText = 'height: 108px; display: flex; align-items: center; scroll-snap-align: center';
  row.innerHTML =
    '<div class="item" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; border-radius: 999px; padding: 8px 10px 8px 8px">' +
      '<button class="pick" aria-label="' + e.sub + ' 선택" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 16px">' +
        '<div class="disc"><div class="label" style="background: ' + e.tone + '">' + e.no + '</div></div>' +
        '<div class="tilt" style="display: flex; flex-direction: column; gap: 2px; white-space: nowrap">' +
          '<span style="font-size: 18px; font-weight: 600">' + e.title + '</span>' +
          '<span style="font-size: 13px; color: #5E5E68">' + e.sub + '</span>' +
        '</div>' +
      '</button>' +
      '<a href="' + e.href + '" class="go" style="flex: none; height: 44px; padding: 0 20px; border-radius: 999px; background: #17171C; color: #FFFFFF; display: flex; align-items: center; font-size: 14px; font-weight: 600">보기</a>' +
    '</div>';
  row.querySelector('button').addEventListener('click', function () {
    list.scrollTo({ top: i * STEP, behavior: 'smooth' });
    setSel(i);
  });
  list.appendChild(row);
  return row;
});
function setSel(n) {
  if (n === sel) return;
  sel = n;
  rows.forEach(function (row, i) {
    var d = i - sel, ad = Math.abs(d), on = d === 0;
    var item = row.querySelector('.item'), go = row.querySelector('.go');
    item.style.transform = 'translateX(' + (on ? 0 : 28 + ad * 34) + 'px)';
    item.style.opacity = Math.max(0.35, 1 - ad * 0.22);
    item.style.backgroundColor = on ? 'rgba(255,255,255,1)' : 'rgba(255,255,255,0)';
    item.style.boxShadow = on ? '0 16px 36px rgba(23,23,28,0.08)' : '0 16px 36px rgba(23,23,28,0)';
    row.querySelector('.tilt').style.transform = 'rotate(' + (d * 11) + 'deg)';
    go.style.opacity = on ? 1 : 0;
    go.style.transform = 'scale(' + (on ? 1 : 0.85) + ')';
    go.style.pointerEvents = on ? 'auto' : 'none';
    go.tabIndex = on ? 0 : -1;
    go.setAttribute('aria-hidden', on ? 'false' : 'true');
  });
}
var ticking = false;
list.addEventListener('scroll', function () {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(function () {
    ticking = false;
    setSel(Math.max(0, Math.min(ENTRIES.length - 1, Math.round(list.scrollTop / STEP))));
  });
}, { passive: true });
setSel(0);
</script>
</body>
</html>
